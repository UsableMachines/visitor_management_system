{% extends "base.html" %}
{% block body_class %}page-login{% endblock %}
{% block title %}Login — VMS{% endblock %}
{% block public_content %}
<div class="auth-card">
  <div class="auth-brand">
    <i class="fas fa-id-badge"></i>
    <h2>Visitor Management System</h2>
  </div>
  <h1>Sign In</h1>
  <p class="subtitle">Enter your credentials to continue</p>
  <form method="POST" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="remember" name="remember" value="1">
      <label for="remember" style="margin:0;font-weight:normal;">Remember me</label>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    <div class="auth-links">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
  </form>
</div>
{% endblock %}
