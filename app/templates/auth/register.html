{% extends "base.html" %}
{% block body_class %}page-register{% endblock %}
{% block title %}Register — VMS{% endblock %}
{% block public_content %}
<div class="auth-card">
  <div class="auth-brand">
    <i class="fas fa-id-badge"></i>
    <h2>Visitor Management System</h2>
  </div>
  <h1>Create Account</h1>
  <p class="subtitle">Register to get started</p>
  <form method="POST" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div class="form-group">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" class="form-control" required>
      </div>
    </div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="password">Password (min 8 characters)</label>
      <input type="password" id="password" name="password" class="form-control" minlength="8" required>
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
    <div class="auth-links">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </form>
</div>
{% endblock %}
