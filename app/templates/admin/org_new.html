{% extends "base.html" %}
{% block title %}New Organization — Admin — VMS{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="fas fa-plus"></i> New Organization</h1>
  <a href="{{ url_for('admin.org_list') }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="card" style="max-width:600px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('admin.org_new') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="name">Organization Name *</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="slug">Slug *</label>
        <input type="text" id="slug" name="slug" class="form-control" required placeholder="e.g., acme-corp">
      </div>
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" class="form-control" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" class="form-control">
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Create Organization</button>
        <a href="{{ url_for('admin.org_list') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
